[package]
name = "wincr-block"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "wincr_block"
path = "src/lib.rs"

[[bin]]
name = "wincr-block"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
iced-x86 = "1.21"
indexmap = { version = "2.2", features = ["serde"] }
object = { version = "0.36", default-features = false, features = ["read", "pe"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
