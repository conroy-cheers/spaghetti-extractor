[project]
id = "wincr-3d-reference-game"
name = "WinCR 3D Reference Game"

[env]
install_root = "WINCR_3D_REFERENCE_ROOT"
reference_package = "WINCR_3D_REFERENCE_PACKAGE"
source_info = "WINCR_3D_REFERENCE_SOURCE_INFO"
ghidra_headless = "WINCR_GHIDRA_HEADLESS"

[provenance]
reference_package_metadata_key = "wincr_3d_reference_package"
source_info_metadata_key = "wincr_3d_reference_source_info"

unknown_directory_markers = [
  "bin",
]

[[binary_rules]]
names = [ "wincr-3d-game.exe" ]
role = "closed_runtime"
scope = "included"
reason = "reference Win32 game executable used to exercise generic clean-room catalog/spec tooling"

[[binary_rules]]
names = [ "wincr-3d-game-window.exe" ]
role = "interface_fixture"
scope = "excluded"
reason = "optional GDI/USER32 window smoke fixture; deterministic behavior and coverage target is wincr-3d-game.exe"

[[external_modules]]
path_contains = [
  "C:\\WINDOWS\\System32\\",
  "C:/WINDOWS/System32/",
  "C:\\windows\\system32\\",
  "C:/windows/system32/",
]
kind = "os_component"
source = "Windows system directory supplied by the execution environment; reimplementation may call the same OS API surface"
reason = "Win32 APIs are modeled as external side effects, not clean-room reimplemented blocks"

[[external_modules]]
names = [
  "dynamorio.dll",
  "drmgr.dll",
  "drwrap.dll",
  "wincr_trace.dll",
  "halo_trace.dll",
]
kind = "trace_instrumentation"
source = "DynamoRIO runtime and this repository's trace client build"
reason = "Instrumentation modules are present only during trace capture"

[[trace_targets]]
id = "json-orbit"
executable = "wincr-3d-game.exe"
expected_filename = "wincr-3d-game.exe"
cwd = "."
args = [ "--json", "--scenario", "orbit", "--frames", "180", "--seed", "7" ]
display_required = false
semantic_profile = { enabled = true, max_routines = 8, max_blocks_per_routine = 16, capture = [ "registers", "call_args", "returns" ] }

[[trace_targets]]
id = "json-collect"
executable = "wincr-3d-game.exe"
expected_filename = "wincr-3d-game.exe"
cwd = "."
args = [ "--json", "--scenario", "collect", "--frames", "150", "--seed", "11" ]
display_required = false

[[trace_targets]]
id = "json-collect-hit"
executable = "wincr-3d-game.exe"
expected_filename = "wincr-3d-game.exe"
cwd = "."
args = [ "--json", "--scenario", "collect", "--frames", "64", "--seed", "2" ]
display_required = false

[[trace_targets]]
id = "json-dive"
executable = "wincr-3d-game.exe"
expected_filename = "wincr-3d-game.exe"
cwd = "."
args = [ "--json", "--scenario", "dive", "--frames", "64", "--seed", "7" ]
display_required = false

[[trace_targets]]
id = "json-orbit-miss"
executable = "wincr-3d-game.exe"
expected_filename = "wincr-3d-game.exe"
cwd = "."
args = [ "--json", "--scenario", "orbit", "--frames", "64", "--seed", "1" ]
display_required = false

[[trace_targets]]
id = "json-burnout"
executable = "wincr-3d-game.exe"
expected_filename = "wincr-3d-game.exe"
cwd = "."
args = [ "--json", "--scenario", "burnout", "--frames", "360", "--seed", "7" ]
display_required = false

[[trace_targets]]
id = "json-aim-miss"
executable = "wincr-3d-game.exe"
expected_filename = "wincr-3d-game.exe"
cwd = "."
args = [ "--json", "--scenario", "aim_miss", "--frames", "4", "--seed", "1" ]
display_required = false

[[trace_targets]]
id = "windowed-smoke"
executable = "wincr-3d-game-window.exe"
expected_filename = "wincr-3d-game-window.exe"
cwd = "."
args = [ "--window-smoke", "--scenario", "orbit", "--frames", "8", "--seed", "7" ]
display_required = true

[gates]
oracle_process_suites = [
  "reference-json-transcript",
  "reference-windowed-startup",
]
oracle_private_suites = []
mutation_kinds = [
  "wrong_state_transition",
  "bad_projection",
  "bad_input_schedule",
  "bad_frame_hash",
  "bad_target_generation",
]

[data_state]
round_trip_kinds = [
  "transcript",
  "game_state",
  "scenario",
  "projection",
  "process_contract",
]
transition_kinds = [
  "fixed_step_simulation",
]

[windows_vm]
trace_root = "C:\\WinCR"
runtime_dir = "WinCR3DReferenceGame"
runtime_stage_dir = "TargetRuntime"
runtime_stage_aliases = []
guest_trace_script = "Run-WinCRReferenceTrace.ps1"
trace_client_name = "wincr_trace.dll"
iso_volume_id = "WINCRREF"
computer_name = "WINCRREF"
operator_display_name = "WinCR Reference Trace Operator"
firewall_rule_name = "OpenSSH-Server-In-TCP-WinCRReference"
firewall_rule_display_name = "OpenSSH Server WinCR Reference"
admin_user = "wincr"
admin_password = "ChangeMe-WinCR-LocalOnly!"
password_env = "WINCR_WINDOWS_VM_PASSWORD"
skip_reports_env = "WINCR_WINDOWS_VM_SKIP_REPORTS"
default_trace_target = "json-orbit"
