[project]
id = "halo-ce"
name = "Halo CE"

[env]
install_root = "HALOCE_INSTALL_ROOT"
reference_package = "HALOCE_REFERENCE_PACKAGE"
source_info = "HALOCE_NIX_HALOCE_SOURCE_INFO"
ghidra_headless = "HALOCE_GHIDRA_HEADLESS"

[provenance]
flake_lock_node = "nix-haloce"
reference_package_metadata_key = "nix_haloce_reference_package"
source_info_metadata_key = "nix_haloce_source_info"

unknown_directory_markers = [
  "program files (x86)",
  "halo custom edition",
]

[[binary_rules]]
names = [ "haloce.exe" ]
role = "closed_runtime"
scope = "included"
reason = "playable client executable"

[[binary_rules]]
names = [ "haloceded.exe" ]
role = "closed_runtime"
scope = "included"
reason = "dedicated server executable"

[[binary_rules]]
names = [ "keystone.dll" ]
role = "closed_runtime"
scope = "included"
reason = "GameSpy/Keystone runtime service component imported by the game"

[[binary_rules]]
names = [ "strings.dll" ]
role = "closed_runtime"
scope = "included"
reason = "closed runtime support DLL shipped in the game directory"

[[binary_rules]]
names = [ "binkw32.dll" ]
role = "closed_runtime"
scope = "included"
reason = "closed Bink video runtime imported by startup/video paths"

[[binary_rules]]
names = [ "ksimeui.dll" ]
role = "candidate_runtime"
scope = "candidate"
reason = "Keystone UI support DLL; keep visible until runtime tracing proves it unused"

[[binary_rules]]
names = [ "mgspid.dll" ]
role = "candidate_runtime"
scope = "candidate"
reason = "Microsoft game service/PID support DLL; keep visible until tracing proves it unused"

[[binary_rules]]
names = [ "patchw32.dll" ]
role = "candidate_runtime"
scope = "candidate"
reason = "patch/runtime support DLL; keep visible until tracing proves it unused"

[[binary_rules]]
names = [ "ogg.dll" ]
role = "source_available_external"
scope = "excluded"
reason = "source-available Ogg dependency"

[[binary_rules]]
names = [ "vorbis.dll" ]
role = "source_available_external"
scope = "excluded"
reason = "source-available Vorbis dependency"

[[binary_rules]]
names = [ "vorbisfile.dll" ]
role = "source_available_external"
scope = "excluded"
reason = "source-available Vorbisfile dependency"

[[binary_rules]]
names = [ "msvcr71.dll" ]
role = "vendor_replaceable"
scope = "excluded"
reason = "vendor CRT runtime; model interface behavior rather than decompile"

[[binary_rules]]
names = [
  "gsarcade.exe",
  "chktrust.exe",
  "haloupdate.exe",
  "uninstal.exe",
  "dw15.exe",
  "dsetup.dll",
  "eula.dll",
  "pidgen.dll",
  "setupenu.dll",
  "shfolder.exe",
  "dxwebsetup.exe",
  "instmsia.exe",
  "instmsiw.exe",
]
role = "excluded_tool_or_redistributable"
scope = "excluded"
reason = "installer, updater, redistributable, or launcher component outside the runtime oracle"

[[binary_rules]]
path_contains = [ "watson" ]
role = "excluded_tool_or_redistributable"
scope = "excluded"
reason = "Watson crash-reporting component"

[[external_modules]]
path_contains = [
  "C:\\WINDOWS\\System32\\",
  "C:/WINDOWS/System32/",
  "C:\\windows\\system32\\",
  "C:/windows/system32/",
]
kind = "os_component"
source = "Windows system directory supplied by the execution environment; reimplementation may call the same OS API surface"
reason = "Win32 and NT APIs are modeled as external side effects, not clean-room reimplemented blocks"

[[external_modules]]
names = [
  "dynamorio.dll",
  "drmgr.dll",
  "drwrap.dll",
  "halo_trace.dll",
  "wincr_trace.dll",
]
kind = "trace_instrumentation"
source = "DynamoRIO runtime and this repository's trace client build"
reason = "Instrumentation modules are present only during trace capture"

[[external_modules]]
names = [
  "ogg.dll",
  "vorbis.dll",
  "vorbisfile.dll",
]
kind = "source_available_dependency"
source = "Xiph.org Ogg/Vorbis source-compatible dependency family"
reason = "Source-available audio codec libraries are outside the proprietary clean-room block obligation set"

[[external_modules]]
names = [ "msvcr71.dll" ]
kind = "redistributable_runtime"
source = "Microsoft Visual C++ runtime redistributable compatible with the original binary ABI"
reason = "CRT behavior is an external runtime dependency for API-compatible reimplementations"

[[trace_targets]]
id = "client"
executable = "haloce.exe"
expected_filename = "haloce.exe"
cwd = "."
args = []
display_required = true

[[trace_targets]]
id = "dedicated"
executable = "haloceded.exe"
expected_filename = "haloceded.exe"
cwd = "."
args = []
display_required = false

[gates]
oracle_process_suites = [
  "client-startup",
  "dedicated-server-console",
  "map-discovery-loading",
  "profile-save-config",
  "loopback-networking",
  "logging-errors",
  "representative-client-launch",
]
oracle_private_suites = [ "private-internal-harness" ]
mutation_kinds = [
  "wrong_implementation",
  "inverted_branch",
  "skipped_external_call",
  "corrupted_serializer",
  "bad_packet_codec",
  "changed_mock_api_behavior",
]

[data_state]
round_trip_kinds = [ "map", "profile", "save", "packet", "config", "codec", "serializer" ]
transition_kinds = [ "state_machine" ]

[windows_vm]
trace_root = "C:\\HaloTrace"
runtime_dir = "HaloCE"
runtime_stage_dir = "TargetRuntime"
runtime_stage_aliases = [ "HaloRuntime" ]
guest_trace_script = "Run-HaloTrace.ps1"
trace_client_name = "halo_trace.dll"
iso_volume_id = "HALOTRACE"
computer_name = "HALOTRACE"
operator_display_name = "Halo Trace Operator"
firewall_rule_name = "OpenSSH-Server-In-TCP-HaloTrace"
firewall_rule_display_name = "OpenSSH Server HaloTrace"
admin_user = "halo"
admin_password = "ChangeMe-HaloTrace-LocalOnly!"
password_env = "HALOCE_WINDOWS_VM_PASSWORD"
skip_reports_env = "HALOCE_WINDOWS_VM_SKIP_REPORTS"
default_trace_target = "Dedicated"
