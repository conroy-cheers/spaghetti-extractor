[build-system]
requires = [ "setuptools>=69" ]
build-backend = "setuptools.build_meta"

[project]
name = "spaghetti-extractor"
version = "0.1.0"
description = "Static Windows binary reconstruction and progressive source-lifting toolkit"
requires-python = ">=3.11"
dependencies = [
  "capstone",
  "pefile",
  "z3-solver",
]

[project.optional-dependencies]
conformance = [
  "unicorn",
]

[project.scripts]
spaghetti-extractor = "spaghetti_extractor.cli:main"
spaghetti-extractor-test = "spaghetti_extractor.testkit.runner:main"
spaghetti-extractor-dev = "spaghetti_extractor.testkit.cli:main"

[project.urls]
Repository = "https://github.com/conroy-cheers/spaghetti-extractor"

[tool.spaghetti-extractor.module-entrypoints]
"spaghetti_extractor.__main__" = "operator"
"spaghetti_extractor.abi.ingestion" = "operator"
"spaghetti_extractor.candidate.callbacks" = "operator"
"spaghetti_extractor.components.interface_v5" = "operator"
"spaghetti_extractor.components.comparison_environment" = "operator"
"spaghetti_extractor.candidate.source_assembly" = "operator"
"spaghetti_extractor.candidate.source_replacements" = "operator"
# Public preparation API used by operator-owned native comparison recipes.
"spaghetti_extractor.components.comparison_original" = "operator"
"spaghetti_extractor.testkit.__main__" = "developer"

[tool.setuptools.packages.find]
where = [ "src" ]

[tool.setuptools.package-data]
spaghetti_extractor = [
  "lean/**/*.lean",
  "resources/ghidra/*.java",
  "resources/native/*.h",
  "resources/native/*.c",
  "resources/comparison/*.h",
  "testkit/fixture_catalog.json",
]
