[build-system]
requires = [ "setuptools>=69" ]
build-backend = "setuptools.build_meta"

[project]
name = "wincr-tools"
version = "0.1.0"
description = "Windows jq Stage A/B reimplementation tooling"
requires-python = ">=3.11"
dependencies = [
  "capstone",
  "pefile",
]

[project.optional-dependencies]
proof = [
  "z3-solver",
]

[project.scripts]
wincr = "wincr.cli:main"
wincr-slice = "wincr.slice_loop:main"

[tool.setuptools.packages.find]
where = [ "src" ]

[tool.setuptools.package-data]
wincr = [ "lean/**/*.lean" ]
