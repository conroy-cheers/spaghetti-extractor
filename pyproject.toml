[build-system]
requires = [ "setuptools>=69" ]
build-backend = "setuptools.build_meta"

[project]
name = "haloce-decomp-tools"
version = "0.1.0"
description = "Windows clean-room catalog, coverage, and oracle-spec tooling"
requires-python = ">=3.11"
dependencies = [
  "capstone",
  "lief",
  "pefile",
  "unicorn",
]

[project.optional-dependencies]
proof = [
  "z3-solver",
]

[project.scripts]
wincr = "haloce_catalog.cli:main"
haloce-catalog = "haloce_catalog.cli:main"

[tool.setuptools.packages.find]
where = [ "src" ]

[tool.setuptools.package-data]
haloce_catalog = [ "schema.sql", "presets/*.toml" ]
