[build-system]
requires = [ "setuptools>=69" ]
build-backend = "setuptools.build_meta"

[project]
name = "spaghetti-extractor"
version = "0.1.0"
description = "Static Windows binary reconstruction and progressive source-lifting toolkit"
requires-python = ">=3.11"
dependencies = [
  "capstone",
  "pefile",
  "z3-solver",
]

[project.optional-dependencies]
conformance = [
  "unicorn",
]

[project.scripts]
spaghetti-extractor = "spaghetti_extractor.cli:main"
spaghetti-extractor-test = "spaghetti_extractor.testkit.runner:main"
spaghetti-extractor-dev = "spaghetti_extractor.testkit.cli:main"

[project.urls]
Repository = "https://github.com/conroy-cheers/spaghetti-extractor"

[tool.setuptools.packages.find]
where = [ "src" ]

[tool.setuptools.package-data]
spaghetti_extractor = [ "lean/**/*.lean" ]

[tool.setuptools.data-files]
"share/spaghetti-extractor/nix" = [
  "nix/bochs-conformance.nix",
