[build-system]
requires = [ "setuptools>=69" ]
build-backend = "setuptools.build_meta"

[project]
name = "spaghetti-extractor"
version = "0.1.0"
description = "Binary reimplementation and equivalence-proof tooling"
requires-python = ">=3.11"
dependencies = [
  "capstone",
  "pefile",
]

[project.optional-dependencies]
proof = [
  "z3-solver",
]

[project.scripts]
spaghetti-extractor = "spaghetti_extractor.cli:main"
spaghetti-extractor-slice = "spaghetti_extractor.slice_loop:main"

[project.urls]
Repository = "https://github.com/conroy-cheers/spaghetti-extractor"

[tool.setuptools.packages.find]
where = [ "src" ]

[tool.setuptools.package-data]
spaghetti_extractor = [ "lean/**/*.lean" ]

[tool.setuptools.data-files]
"share/spaghetti-extractor/nix" = [ "nix/stage-a-lean-graph.nix" ]
"share/spaghetti-extractor/profiles" = [ "profiles/*.json" ]
