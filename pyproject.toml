[build-system]
requires = [ "setuptools>=69" ]
build-backend = "setuptools.build_meta"

[project]
name = "spaghetti-extractor"
version = "0.1.0"
description = "Static Windows binary reconstruction and progressive source-lifting toolkit"
requires-python = ">=3.11"
dependencies = [
  "capstone",
  "pefile",
  "z3-solver",
]

[project.optional-dependencies]
conformance = [
  "unicorn",
]

[project.scripts]
spaghetti-extractor = "spaghetti_extractor.cli:main"
spaghetti-extractor-slice = "spaghetti_extractor.slice_loop:main"

[project.urls]
Repository = "https://github.com/conroy-cheers/spaghetti-extractor"

[tool.setuptools.packages.find]
where = [ "src" ]

[tool.setuptools.package-data]
spaghetti_extractor = [ "lean/**/*.lean" ]

[tool.setuptools.data-files]
"share/spaghetti-extractor/nix" = [
  "nix/bochs-conformance.nix",
  "nix/ca-python-json-phase.nix",
  "nix/callable-external-runtime-contract.py",
  "nix/machine-import-control-profile.nix",
  "nix/python-module-closure.nix",
  "nix/python-module-validation.nix",
  "nix/python-module-index.json",
  "nix/singlestep-80386-conformance.nix",
  "nix/stage-a-builder-public-keys",
  "nix/stage-a-builders",
  "nix/stage-a-external-interface-profile.nix",
  "nix/stage-a-isa-conformance.nix",
  "nix/stage-a-isa-qualification-graph.nix",
  "nix/stage-a-isa-semantic-kernel.nix",
  "nix/stage-a-inductive-certificate-kernel.nix",
  "nix/stage-a-machine-ir-isa-qualification-v2.nix",
  "nix/stage-a-lightweight-ca-builders",
  "nix/stage-a-roundtrip-corpus.nix",
  "nix/stage-b-component-analysis.nix",
  "nix/stage-b-component-discovery.nix",
  "nix/stage-b-component-interfaces.nix",
  "nix/stage-b-component-selection.nix",
  "nix/stage-b-interpreter-package.nix",
  "nix/stage-b-linked-libraries.nix",
  "nix/stage-b-native-object-graph.nix",
  "nix/stage-b-semantic-component-workspaces.nix",
  "nix/stage-b-semantic-components.nix",
  "nix/stage-b-source-call-substitutions.nix",
  "nix/stage-b-source-component-assurance.nix",
  "nix/stage-b-functional-suite.nix",
  "nix/stage-b-headless-diagnostic-run.nix",
  "nix/stage-b-hybrid-candidate.nix",
  "nix/stage-b-static-hybrid-completeness.nix",
  "nix/stage-b-static-hybrid-authority-v2.nix",
  "nix/stage-b-target-intent.nix",
  "nix/stage-b-upstream-shell-suite.nix",
]
"share/spaghetti-extractor/profiles" = [ "profiles/*.json" ]
